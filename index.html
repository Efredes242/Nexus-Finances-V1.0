<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Finance | Dashboard</title>
  <link rel="icon" type="image/png" href="/logo-n.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            outfit: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            border: "rgba(255, 255, 255, 0.1)",
            input: "rgba(255, 255, 255, 0.05)",
            ring: "#3b82f6",
            background: "#020617",
            foreground: "#f8fafc",
            primary: {
              DEFAULT: "#3b82f6",
              foreground: "#ffffff",
            },
            secondary: {
              DEFAULT: "#1e293b",
              foreground: "#f8fafc",
            },
            accent: {
              DEFAULT: "#6366f1",
              foreground: "#ffffff",
            },
            destructive: {
              DEFAULT: "#f43f5e",
              foreground: "#ffffff",
            },
            card: {
              DEFAULT: "rgba(15, 23, 42, 0.6)",
              foreground: "#f8fafc",
            }
          },
        },
      },
      plugins: [],
    }
  </script>
  <style>
    /* Paleta unificada con Admin Panel: github-dark base (#05070a) con toques teal */
    body {
      background-color: #05070a;
      background-image:
        radial-gradient(at 0% 0%, rgba(45, 212, 191, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.06) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }

    /* Paleta unificada Admin-style: fondos de github-dark (#0d1117 / #161b22 / #05070a)
       en lugar del slate-800/900 azulado. Bordes slate-800 más sutiles. */
    .glass {
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(30, 41, 59, 0.6);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .glass-hover:hover {
      background: rgba(22, 27, 34, 0.8);
      border-color: rgba(45, 212, 191, 0.4);
      box-shadow: 0 0 20px rgba(45, 212, 191, 0.15);
      transform: translateY(-2px);
    }

    .glass-card {
      background: linear-gradient(145deg, rgba(22, 27, 34, 0.6) 0%, rgba(13, 17, 23, 0.8) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(30, 41, 59, 0.5);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .glass-select {
      background-color: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(30, 41, 59, 0.6);
      color: #60a5fa;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2360a5fa' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
    }

    .glass-select-new {
      background-color: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(30, 41, 59, 0.6);
      color: #2dd4bf;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%232dd4bf' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
    }

    .glass-select option,
    .glass-select-new option {
      background-color: #0d1117;
      color: #f8fafc;
    }

    .shine-hover {
      position: relative;
      overflow: hidden;
    }

    .shine-hover::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right,
          transparent,
          rgba(255, 255, 255, 0.05),
          transparent);
      transform: skewX(-25deg);
      transition: 0.5s;
    }

    .shine-hover:hover::after {
      left: 200%;
      transition: 0.5s ease-in-out;
    }

    .text-glow {
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .neon-border {
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3), inset 0 0 10px rgba(59, 130, 246, 0.1);
    }

    .text-gradient {
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Landing Page Specific Styles */
    .landing-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .landing-blue-glow {
      box-shadow: 0 0 50px -12px rgba(59, 130, 246, 0.3);
    }

    .landing-gradient-text {
      background: linear-gradient(to right, #60a5fa, #3b82f6, #2563eb);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Mobile Menu Button Animations */
    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.02);
      }
    }

    @keyframes ping-slow {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.3;
      }

      100% {
        transform: scale(1.2);
        opacity: 0;
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 3s ease-in-out infinite;
    }

    .animate-ping-slow {
      animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      pointer-events: none;
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  </body>

</html>
